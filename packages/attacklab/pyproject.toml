[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attacklab"
version = "0.1.0"
description = "TraceSeal attack lab (M7): reproducible distortion + collusion harness, real metrics to docs/RESULTS.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    # tscore, sender, and forensics are installed separately (editable) —
    # see packages/attacklab/Dockerfile's comment. Only tscore.tardos and
    # sender/forensics's pure-image code are ever imported here — never
    # tscore.kem/tscore.sig, ledger, ca, or keyrelease — so this package
    # never touches liboqs/PQC or the live protocol stack at all. pymupdf
    # is declared directly (not just transitively via sender) since sender
    # is installed --no-deps in the Dockerfile (its other deps —
    # scikit-image, httpx — are only needed by sender/forensics modules
    # this package never imports).
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    "Pillow>=10.3,<12.0",
    "pymupdf>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.9,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attacklab = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["cv2.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
