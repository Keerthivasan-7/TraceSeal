[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca"
version = "0.1.0"
description = "TraceSeal offline root CA — M3 scope: direct certificate issuance via a seed script, no ledger quorum yet (that's M4). See docs/DECISIONS.md ADR-0011."
requires-python = ">=3.12,<3.13"
dependencies = [
    # tscore is installed separately (editable, from ../tscore) — see
    # packages/sender/Dockerfile's comment for why this isn't a PEP 508
    # path dependency here.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.9,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
markers = [
    "requires_liboqs: needs a working liboqs-python install (built liboqs C library)",
]
testpaths = ["tests"]
