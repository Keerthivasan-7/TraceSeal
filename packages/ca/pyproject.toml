[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca"
version = "0.1.0"
description = "TraceSeal offline root CA — direct certificate issuance (ca.issue, used by the seed script for infra bootstrap) plus the real M4 enrolment/revocation quorum ceremony (ca.enrolment). See docs/DECISIONS.md ADR-0011, ADR-0019."
requires-python = ">=3.12,<3.13"
dependencies = [
    # tscore and ledger are installed separately (editable, from ../tscore,
    # ../ledger) — see packages/sender/Dockerfile's comment for why this
    # isn't a PEP 508 path dependency here. `ledger` is installed --no-deps
    # everywhere (it's a client-only use, no FastAPI needed), so httpx —
    # ledger.client's own dependency — must be declared directly here too.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.9,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
markers = [
    "requires_liboqs: needs a working liboqs-python install (built liboqs C library)",
]
testpaths = ["tests"]
