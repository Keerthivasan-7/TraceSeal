[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics"
version = "0.1.0"
description = "TraceSeal forensics: artifact registration, per-position detection, Tardos accusation (M2 scope: clean screenshots only, see M5/M7)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # tscore and sender are installed separately (editable/--no-deps, like
    # packages/sender/Dockerfile does for tscore) rather than declared as
    # PEP 508 path dependencies here — see that Dockerfile's comment for why.
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    "Pillow>=10.3,<12.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.9,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# opencv (and pymupdf, transitively via `sender`) ship no type stubs.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["cv2.*", "pymupdf.*", "skimage.*", "scipy.*"]
ignore_missing_imports = true
# opencv-python-headless's bundled stubs are also incomplete/wrong in
# places (e.g. missing ORB_create) rather than just absent, which
# ignore_missing_imports alone doesn't cover — those specific call sites
# carry their own targeted `# type: ignore` in align.py.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
