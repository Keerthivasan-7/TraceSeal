[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tscore"
version = "0.1.0"
description = "TraceSeal shared crypto/schema core: PQC KEM-DEM, signatures, HKDF, AEAD, Shamir, canonical CBOR."
requires-python = ">=3.12,<3.13"
dependencies = [
    "liboqs-python==0.16.0.1",
    "cryptography>=42.0,<44.0",
    "argon2-cffi>=23.1,<24.0",
    "cbor2>=5.6,<6.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "hypothesis>=6.100,<7.0",
    "mypy>=1.9,<2.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "oqs.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
markers = [
    "slow: Monte-Carlo / property-based tests too slow for the default run",
    "requires_liboqs: needs a working liboqs-python install (built liboqs C library)",
]
testpaths = ["tests"]
