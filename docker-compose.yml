# TraceSeal — Docker Compose.
#
# Every service lives on `traceseal_internal`, which Docker marks
# `internal: true`: no default route out, no DNS to the outside world. As
# later milestones add web services, they attach to this same network and
# nothing else.
#
# M3 adds the real multi-party protocol: `ca` (one-shot PKI seeding),
# `ledger-0..3` (LedgerLite replicas), `keyrelease-0..4` (Shamir share
# custody + KeyGrant issuance), and `agent` (per-officer CLI, run once per
# officer via `docker compose run`). All of them share `./demo/pki` as
# their PKI directory and `./demo/blob` as the filesystem blob store (spec
# Section 5's "MinIO or a local filesystem blob store" — see
# docs/DECISIONS.md for why M3 picks the latter).

networks:
  traceseal_internal:
    internal: true

services:
  tscore:
    build:
      context: .
      dockerfile: packages/tscore/Dockerfile
    image: traceseal/tscore:m0
    networks:
      - traceseal_internal
    # `make up` should demonstrably start a running container with no
    # egress; the actual test suites are invoked via `make test` /
    # `docker compose run`, which override this command per invocation.
    command: ["sleep", "infinity"]

  sender:
    build:
      context: .
      dockerfile: packages/sender/Dockerfile
    image: traceseal/sender:m3
    networks:
      - traceseal_internal
    command: ["sleep", "infinity"]
    # So package/blob output and demo/pki reads land on the host under
    # demo/, not just inside the (ephemeral, --rm'd) container.
    volumes:
      - ./demo:/app/demo

  forensics:
    build:
      context: .
      dockerfile: packages/forensics/Dockerfile
    image: traceseal/forensics:m5
    networks:
      - traceseal_internal
    command: ["sleep", "infinity"]
    # So `demo-m2`'s simulated screenshots and `demo-m5`'s evidence bundle
    # land on the host under demo/out/, same reasoning as sender's mount
    # above (this also covers demo/pki — no separate PKI mount needed).
    volumes:
      - ./demo:/app/demo
    # Since M5: `forensics.demo_m5` registers a document with the live
    # ledger + key-release cluster and reveals from the key-release vault
    # — needs both up first (see Makefile's demo-m5 target for the actual
    # startup ordering `depends_on` alone doesn't guarantee for `run --rm`).
    depends_on:
      - ledger-0
      - keyrelease-0

  verifier:
    build:
      context: .
      dockerfile: packages/verifier/Dockerfile
    image: traceseal/verifier:m5
    networks:
      - traceseal_internal
    # No `depends_on` anything, deliberately — G4's whole point is that
    # `traceseal-verify` never needs the live cluster, only the .tsev file
    # handed to it. Only mounts demo/ (to read a bundle written there by
    # forensics); never touches demo/pki.
    volumes:
      - ./demo:/app/demo

  attacklab:
    build:
      context: .
      dockerfile: packages/attacklab/Dockerfile
    image: traceseal/attacklab:m7
    networks:
      - traceseal_internal
    command: ["sleep", "infinity"]
    # No `depends_on` anything — the whole point of this milestone's
    # reproducibility requirement (spec Section 15) is that every trial
    # runs in-process against `sender`'s rendering + `forensics`'s
    # detection, never the live protocol stack. Mounts `docs/` (writes
    # RESULTS.md) and `attacklab/` (reads real/, writes out/) directly,
    # since neither lives under `demo/`. `.git` is mounted read-only so
    # `attacklab.harness.git_commit` can record a real commit hash in
    # RESULTS.md's header (spec: "the table header records the git
    # commit") instead of silently falling back to "unknown" — confirmed
    # directly, not assumed: this failed exactly that way before the
    # mount was added.
    volumes:
      - ./docs:/app/docs
      - ./attacklab:/app/attacklab
      - ./.git:/app/.git:ro

  ca:
    build:
      context: .
      dockerfile: packages/ca/Dockerfile
    image: traceseal/ca:m3
    networks:
      - traceseal_internal
    volumes:
      - ./demo:/app/demo
    # One-shot: `docker compose run --rm ca` seeds demo/pki/ and exits;
    # `docker compose run --rm ca python -m ca.demo_m4` runs the real
    # enrolment/revocation ceremony (M4) against the live ledger cluster.
    # No long-running default here (unlike the sleep-infinity services
    # above) since there's nothing for an idle CA container to do.

  ledger-0:
    build:
      context: .
      dockerfile: packages/ledger/Dockerfile
    image: traceseal/ledger:m3
    networks:
      - traceseal_internal
    environment:
      REPLICA_INDEX: "0"
      REPLICA_COUNT: "4"
      PKI_DIR: /pki
      DB_PATH: /data/ledger-0.db
      PEER_URL_TEMPLATE: http://ledger-{i}:8000
      FABRIC_GATEWAY_URL: http://fabric-gateway:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/ledger-0:/data
      # M6: `docker compose run --rm ledger-0 python -m ledger.checkpoint`
      # writes here — ledger-0 is also the container used for
      # `ledger.cosigner` (PKI_DIR=/pki already gives it every
      # fabric-validator-N identity) since it's the one ledger replica
      # image that already has the whole `ledger` package installed.
      - ./demo/checkpoints:/checkpoints

  ledger-1:
    build:
      context: .
      dockerfile: packages/ledger/Dockerfile
    image: traceseal/ledger:m3
    networks:
      - traceseal_internal
    environment:
      REPLICA_INDEX: "1"
      REPLICA_COUNT: "4"
      PKI_DIR: /pki
      DB_PATH: /data/ledger-1.db
      PEER_URL_TEMPLATE: http://ledger-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/ledger-1:/data

  ledger-2:
    build:
      context: .
      dockerfile: packages/ledger/Dockerfile
    image: traceseal/ledger:m3
    networks:
      - traceseal_internal
    environment:
      REPLICA_INDEX: "2"
      REPLICA_COUNT: "4"
      PKI_DIR: /pki
      DB_PATH: /data/ledger-2.db
      PEER_URL_TEMPLATE: http://ledger-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/ledger-2:/data

  ledger-3:
    build:
      context: .
      dockerfile: packages/ledger/Dockerfile
    image: traceseal/ledger:m3
    networks:
      - traceseal_internal
    environment:
      REPLICA_INDEX: "3"
      REPLICA_COUNT: "4"
      PKI_DIR: /pki
      DB_PATH: /data/ledger-3.db
      PEER_URL_TEMPLATE: http://ledger-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/ledger-3:/data

  keyrelease-0:
    build:
      context: .
      dockerfile: packages/keyrelease/Dockerfile
    image: traceseal/keyrelease:m3
    networks:
      - traceseal_internal
    environment:
      NODE_INDEX: "0"
      NODE_COUNT: "5"
      PKI_DIR: /pki
      DB_PATH: /data/keyrelease-0.db
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      PEER_URL_TEMPLATE: http://keyrelease-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/keyrelease-0:/data
    depends_on:
      - ledger-0

  keyrelease-1:
    build:
      context: .
      dockerfile: packages/keyrelease/Dockerfile
    image: traceseal/keyrelease:m3
    networks:
      - traceseal_internal
    environment:
      NODE_INDEX: "1"
      NODE_COUNT: "5"
      PKI_DIR: /pki
      DB_PATH: /data/keyrelease-1.db
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      PEER_URL_TEMPLATE: http://keyrelease-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/keyrelease-1:/data
    depends_on:
      - ledger-0

  keyrelease-2:
    build:
      context: .
      dockerfile: packages/keyrelease/Dockerfile
    image: traceseal/keyrelease:m3
    networks:
      - traceseal_internal
    environment:
      NODE_INDEX: "2"
      NODE_COUNT: "5"
      PKI_DIR: /pki
      DB_PATH: /data/keyrelease-2.db
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      PEER_URL_TEMPLATE: http://keyrelease-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/keyrelease-2:/data
    depends_on:
      - ledger-0

  keyrelease-3:
    build:
      context: .
      dockerfile: packages/keyrelease/Dockerfile
    image: traceseal/keyrelease:m3
    networks:
      - traceseal_internal
    environment:
      NODE_INDEX: "3"
      NODE_COUNT: "5"
      PKI_DIR: /pki
      DB_PATH: /data/keyrelease-3.db
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      PEER_URL_TEMPLATE: http://keyrelease-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/keyrelease-3:/data
    depends_on:
      - ledger-0

  keyrelease-4:
    build:
      context: .
      dockerfile: packages/keyrelease/Dockerfile
    image: traceseal/keyrelease:m3
    networks:
      - traceseal_internal
    environment:
      NODE_INDEX: "4"
      NODE_COUNT: "5"
      PKI_DIR: /pki
      DB_PATH: /data/keyrelease-4.db
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      PEER_URL_TEMPLATE: http://keyrelease-{i}:8000
    volumes:
      - ./demo/pki:/pki:ro
      - ./demo/data/keyrelease-4:/data
    depends_on:
      - ledger-0

  agent:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    image: traceseal/agent:m3
    networks:
      - traceseal_internal
    command: ["sleep", "infinity"]
    volumes:
      - ./demo:/app/demo
    depends_on:
      - keyrelease-0

  # M8 UI bridge (spec Section 14): one lightweight FastAPI service calling
  # ca/sender/forensics/agent's existing logic directly and proxying to
  # ledger's/keyrelease's own live HTTP services — no protocol code
  # duplicated here (docs/DECISIONS.md). No host port published — only the
  # `web` frontend (added when it exists) is reachable from outside this
  # network, via an internal reverse proxy to this service.
  web-api:
    build:
      context: .
      dockerfile: packages/web-api/Dockerfile
    image: traceseal/web-api:m8
    networks:
      - traceseal_internal
    environment:
      PKI_DIR: /app/demo/pki
      DEMO_DIR: /app/demo
      BLOB_DIR: /app/demo/blob
      KEYSTORE_DIR: /app/demo/keystores
      LEDGER_BACKEND: ${LEDGER_BACKEND:-lite}
      LEDGER_LEADER_URL: http://ledger-0:8000
      LEDGER_REPLICA_URLS: "http://ledger-0:8000,http://ledger-1:8000,http://ledger-2:8000,http://ledger-3:8000"
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-http://fabric-gateway:8000}
      KEYRELEASE_URL_TEMPLATE: http://keyrelease-{i}:8000
      KEYRELEASE_NODE_COUNT: "5"
    volumes:
      - ./demo:/app/demo
      - ./attacklab:/app/attacklab
    depends_on:
      - ledger-0
      - keyrelease-0

  # M6: Fabric 3 SmartBFT backend (spec Section 12) — 4 organizations, each
  # with its own orderer (BFT consenter) and its own peer; a single
  # channel `tschannel`, a single chaincode `traceseal`. `fabric-tools`
  # is a one-shot/utility container (like `ca` above) for cryptogen,
  # configtxgen, osnadmin, and peer lifecycle commands — see
  # fabric-network/scripts/. No host ports are published anywhere here,
  # same internal-only-network discipline as every other service.
  fabric-tools:
    # No published `fabric-tools` image contains a BFT-aware
    # `configtxgen` — confirmed directly: both `2.5.9` and `latest`
    # (which itself still resolves to v2.5.16) panic on "invalid keys:
    # ConsenterMapping, SmartBFT". Built from Fabric v3.1.5 source
    # instead, the same tag already pinned for orderer/peer — see
    # fabric-network/tools.Dockerfile and docs/DECISIONS.md ADR-0031.
    build:
      context: .
      dockerfile: fabric-network/tools.Dockerfile
    image: traceseal/fabric-tools:m6
    networks:
      - traceseal_internal
    working_dir: /fabric-network
    volumes:
      - ./fabric-network:/fabric-network
      - /var/run/docker.sock:/host/var/run/docker.sock
    environment:
      FABRIC_CFG_PATH: /fabric-network
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: traceseal_traceseal_internal
    command: ["sleep", "infinity"]

  orderer1.org1.traceseal.local:
    image: hyperledger/fabric-orderer:3.1.5
    container_name: orderer.org1.traceseal.local
    networks:
      - traceseal_internal
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: Org1OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/org1.traceseal.local/orderers/orderer.org1.traceseal.local/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/org1.traceseal.local/orderers/orderer.org1.traceseal.local/tls:/var/hyperledger/orderer/tls
      - ./fabric-network/crypto-config/cluster-cas:/var/hyperledger/orderer/cluster-cas:ro
      - fabric_orderer1_data:/var/hyperledger/production/orderer

  orderer2.org2.traceseal.local:
    image: hyperledger/fabric-orderer:3.1.5
    container_name: orderer.org2.traceseal.local
    networks:
      - traceseal_internal
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: Org2OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/org2.traceseal.local/orderers/orderer.org2.traceseal.local/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/org2.traceseal.local/orderers/orderer.org2.traceseal.local/tls:/var/hyperledger/orderer/tls
      - ./fabric-network/crypto-config/cluster-cas:/var/hyperledger/orderer/cluster-cas:ro
      - fabric_orderer2_data:/var/hyperledger/production/orderer

  orderer3.org3.traceseal.local:
    image: hyperledger/fabric-orderer:3.1.5
    container_name: orderer.org3.traceseal.local
    networks:
      - traceseal_internal
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: Org3OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/org3.traceseal.local/orderers/orderer.org3.traceseal.local/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/org3.traceseal.local/orderers/orderer.org3.traceseal.local/tls:/var/hyperledger/orderer/tls
      - ./fabric-network/crypto-config/cluster-cas:/var/hyperledger/orderer/cluster-cas:ro
      - fabric_orderer3_data:/var/hyperledger/production/orderer

  orderer4.org4.traceseal.local:
    image: hyperledger/fabric-orderer:3.1.5
    container_name: orderer.org4.traceseal.local
    networks:
      - traceseal_internal
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: Org4OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/cluster-cas/bundle.pem]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/org4.traceseal.local/orderers/orderer.org4.traceseal.local/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/org4.traceseal.local/orderers/orderer.org4.traceseal.local/tls:/var/hyperledger/orderer/tls
      - ./fabric-network/crypto-config/cluster-cas:/var/hyperledger/orderer/cluster-cas:ro
      - fabric_orderer4_data:/var/hyperledger/production/orderer

  peer0.org1.traceseal.local:
    image: hyperledger/fabric-peer:3.1.5
    container_name: peer0.org1.traceseal.local
    networks:
      - traceseal_internal
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
