# Edge config for the isolated-roles deployment (docker-compose.roles.yml).
#
# One published loopback port, many origins: the Host header picks which role
# backend /api/ is proxied to. Each console is therefore a different browser
# origin (own cookies, own storage), which is what stops two consoles in one
# browser profile from sharing or overwriting a login. Everything else —
# security headers, the vendored bundle, caching rules — matches nginx.conf.
#
# Upstreams are resolved lazily through Docker's embedded DNS (127.0.0.11) so
# nginx still starts when optional officers (profile `officers-extra`) are
# not running; a request for a stopped officer gets 502, not a boot failure.

map $host $role_upstream {
    default                 "";
    command.localhost       http://console-command:8000;
    authority.localhost     http://console-authority:8000;
    ops.localhost           http://console-ops:8000;
    officer-a.localhost     http://agent-officer-a:8000;
    officer-b.localhost     http://agent-officer-b:8000;
    officer-c.localhost     http://agent-officer-c:8000;
    officer-d.localhost     http://agent-officer-d:8000;
    officer-e.localhost     http://agent-officer-e:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        default_type application/json;
        # Unknown host (plain localhost / 127.0.0.1): no console lives here.
        # The UI treats this 404 as "show the console launcher".
        if ($role_upstream = "") {
            return 404 '{"detail":"no console on this host"}';
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $role_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
